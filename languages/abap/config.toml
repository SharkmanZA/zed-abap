name = "ABAP"
grammar = "abap"
path_suffixes = ["abap"]
# Only `"`: a `*` comment must be in column 0, but Zed matches comment
# prefixes after indentation, which would treat `* factor` lines as comments.
line_comments = ["\" "]
tab_size = 2
# `-` is deliberately not a word character: it would join `go_app-` in
# `go_app->run`. `<`/`>` would join `->`/`=>` to names.
word_characters = ["%", "/"]
autoclose_before = ".,:)]}"
brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "|", end = "|", close = true, newline = false, not_in = ["string", "comment"] },
]

name = "ABAP"
grammar = "abap"
path_suffixes = ["abap", "abap_unit"]
line_comments = ["\" ", "* "]
tab_size = 2
word_characters = ["-", "%", "/", "<", ">"]
brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "|", end = "|", close = true, newline = false, not_in = ["string", "comment"] },
]

name = "ABAP"
grammar = "abap"
path_suffixes = ["abap"]
# Only `"`: a `*` comment must be in column 0, but Zed matches comment
# prefixes after indentation, which would treat `* factor` lines as comments.
line_comments = ["\" "]
tab_size = 2
# `-` is deliberately not a word character: it would join `go_app-` in
# `go_app->run`. `<`/`>` would join `->`/`=>` to names.
word_characters = ["%", "/"]
autoclose_before = ".,:)]}"

# Auto-indent. Mostly from indents.scm (syntax). These line patterns cover:
# - Enter right after a block's opening statement (IF, CASE, LOOP, METHOD,
#   CLASS, ...) when nothing follows it yet (end of file), so there is no
#   syntax range. Clause keywords (ELSE, WHEN, CATCH, ... SECTION) are left
#   out on purpose: right after one of them Zed would let this pattern
#   override the syntax outdent of an outer closer (ENDCLASS after an empty
#   PRIVATE SECTION). The line must be exactly one opening statement: keyword
#   first, no `KEYWORD = ...` (a variable sharing the name), balanced
#   parentheses (so the last line of a multi-line COND / SWITCH isn't one),
#   nothing after the period (`IF x. RETURN. ENDIF.`), and no forward
#   declaration (CLASS ... DEFINITION DEFERRED / LOAD).
# - Event blocks (START-OF-SELECTION., AT SELECTION-SCREEN ..., ...): their
#   statements are indented, and the next event keyword, FORM or CLASS
#   outdents one level (these only ever appear at the top level).
# - Blocks the grammar doesn't model (AT NEW ... ENDAT, DEFINE ...
#   END-OF-DEFINITION, ...). SELECT ... ENDSELECT is not indented on Enter
#   because a SELECT loop can't be told apart from a single SELECT by its first
#   line, but ENDSELECT still outdents.
increase_indent_pattern = '''(?i)^\s*(?:(?:if|case|while)\s+(?:[^\"'`.()=\s]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`)*\))*\))(?:[^\"'`.()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`)*\))*\))*|(?:try|do|loop)(?:\s+(?:[^\"'`.()=\s]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`)*\))*\))(?:[^\"'`.()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`)*\))*\))*)?|(?:method|form)\s+[\w/~]+(?:[^\"'`.()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`)*\))*\))*|(?:function|module)\s+[\w/]+(?:\s+(?:input|output))?\s*|class\s+[\w/]+\s+implementation\s*|class\s+[\w/]+\s+definition(?:\s+(?:public|final|abstract|create\s+(?:public|protected|private)|inheriting\s+from\s+[\w/]+|for\s+testing|risk\s+level\s+\w+|duration\s+\w+|(?:global\s+)?friends(?:\s+[\w/]+)+|shared\s+memory\s+enabled|for\s+behavior\s+of\s+[\w/]+))*\s*|interface\s+[\w/]+(?:\s+public)?\s*|(?:on\s+change\s+of|provide|test-seam|enhancement|at\s+new|at\s+end\s+of)\s+(?:[^\"'`.()=\s]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`)*\))*\))(?:[^\"'`.()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`)*\))*\))*|at\s+(?:first|last)|exec\s+sql(?:\s+(?:[^\"'`.()=\s]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`)*\))*\))(?:[^\"'`.()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`)*\))*\))*)?|define\s+[\w/~]+(?:[^\"'`.()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`)*\))*\))*|(?:load-of-program|initialization|start-of-selection|end-of-selection|top-of-page(?:\s+during\s+line-selection)?|end-of-page|at\s+selection-screen|at\s+line-selection|at\s+user-command)\b(?:[^\"'`.()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`|\((?:[^\"'`()]|'[^']*'|`[^`]*`)*\))*\))*)\.\s*(?:\".*)?$'''
decrease_indent_pattern = '''(?i)^\s*(?:endat|endselect|endon|endprovide|endexec|end-of-definition|end-test-seam|endenhancement|endcatch|load-of-program|initialization|start-of-selection|end-of-selection|top-of-page(?:\s+during\s+line-selection)?|end-of-page|at\s+selection-screen|at\s+line-selection|at\s+user-command|form\s+[\w/]+|class\s+[\w/]+\s+(?:definition|implementation))\b'''
brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "|", end = "|", close = true, newline = false, not_in = ["string", "comment"] },
]

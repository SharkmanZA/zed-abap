id = "abap"
name = "ABAP"
description = "ABAP syntax highlighting, outline, auto-indent, file icons and abaplint diagnostics for Zed, powered by a Tree-sitter grammar."
version = "0.3.1"
schema_version = 1
authors = ["Jake Mileham"]
repository = "https://github.com/SharkmanZA/zed-abap"

# The grammar lives in this repo under grammar/. Zed fetches `rev` from
# `repository` and compiles grammar/src to WASM. After changing the grammar,
# run scripts/bump-grammar.sh (commits it and updates `rev`), then
# `git push`, then `zed: rebuild dev extension`. See README for switching to
# a file:// URL for offline work.
[grammars.abap]
repository = "https://github.com/SharkmanZA/zed-abap"
rev = "3d5afd280e10df36e5260878463f0b7eb88a6e4c"
path = "grammar"

# abaplint diagnostics. src/lib.rs installs the server's npm packages and runs
# server/server.js with Zed's Node.
[language_servers.abaplint]
name = "abaplint"
languages = ["ABAP"]
